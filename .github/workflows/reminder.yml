name: Daily Class Reminder

on:
  schedule:
    # 8:00 AM Philippines time (UTC+8) = 12:00 AM UTC
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reminder bot
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          RECIPIENT_ID: ${{ secrets.RECIPIENT_ID }}
        run: python bot.py
