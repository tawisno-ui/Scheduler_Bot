name: Keep Alive

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday midnight UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keep repo alive with a commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last kept alive: $(date)" > .keepalive
          git add .keepalive
          git commit -m "chore: keep repo alive [skip ci]"
          git push
